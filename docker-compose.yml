version: '3.8'

services:
  retro-player:
    image: ghcr.io/godarayudhvir/retro-player:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retro-player
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - ROMS_DIR=/roms
    volumes:
      # Mount your host ROMs directory to /roms inside container (Read/Write allows uploading new games directly from the UI)
      - ./roms:/roms
