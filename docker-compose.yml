services:
  retro-player:
    image: ghcr.io/godarayudhvir/retro-player:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retro-player
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - ROMS_DIR=/roms
      - BGM_DIR=/bgm
      - DATA_DIR=/data
      # Audio configuration:
      # Set to 'true' to include bundled 8-bit chiptune audio tracks; set to 'false' for purely your own audio tracks
      - INCLUDE_DEMO_BGM=true
      # Discord Rich Presence configuration:
      # - DISCORD_CLIENT_ID=1544079303598411776
      # - APP_URL=https://retro.yourdomain.com
    volumes:
      # Mount your host ROMs directory to /roms (Read/Write allows uploading new games directly from the UI)
      - ./roms:/roms
      # Mount your host BGM tracks directory to /bgm
      - ./bgm:/bgm
      # Mount persistent server database (profiles, favorites, playtime, controller mappings, scraped metadata)
      - ./data:/data

  # --- Optional: Automatic HTTPS Reverse Proxy via Caddy ---
  # Uncomment the service below for zero-configuration TLS / HTTPS on Linux or HomeLabs.
