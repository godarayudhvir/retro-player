<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blue-btn-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="red-btn-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="green-btn-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="yellow-btn-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3b82f6" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#body-grad)" stroke="#3b82f6" stroke-width="2.5" filter="url(#glow)" />

  <!-- D-Pad Base -->
  <g fill="#94a3b8">
    <rect x="13" y="27" width="18" height="6" rx="2" />
    <rect x="19" y="21" width="6" height="18" rx="2" />
    <circle cx="22" cy="30" r="1.5" fill="#0f172a" />
  </g>

  <!-- Action Buttons (ABXY) -->
  <circle cx="43" cy="23" r="3.2" fill="url(#yellow-btn-grad)" />
  <circle cx="49" cy="29" r="3.2" fill="url(#red-btn-grad)" />
  <circle cx="37" cy="29" r="3.2" fill="url(#blue-btn-grad)" />
  <circle cx="43" cy="35" r="3.2" fill="url(#green-btn-grad)" />

  <!-- Center Select/Start Pills -->
  <rect x="26" y="44" width="4.5" height="2.5" rx="1" fill="#64748b" transform="rotate(-20 28 45)" />
  <rect x="33.5" y="44" width="4.5" height="2.5" rx="1" fill="#64748b" transform="rotate(-20 35.5 45)" />
</svg>
