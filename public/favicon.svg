<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <!-- Background subtle gloss / depth -->
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a334a" />
      <stop offset="100%" stop-color="#141926" />
    </linearGradient>
    <linearGradient id="well-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2538" />
      <stop offset="100%" stop-color="#0f131d" />
    </linearGradient>
    <!-- Saturated Diamond Face Buttons -->
    <linearGradient id="btn-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="btn-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="btn-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="btn-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="dpad-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Controller Base Shell (Transparent canvas, zero white borders) -->
  <path filter="url(#shadow)" fill="url(#body-grad)" stroke="#384259" stroke-width="8" d="M774.64,309.3H227.03c-107.03,0-196.1,87.57-195.9,194.6.19,107.11,87.08,193.89,194.24,193.89,31.21,0,60.69-7.36,86.82-20.44,7.51-3.76,15.79-5.69,24.19-5.69h327.25c8.4,0,16.68,1.94,24.19,5.7,26.11,13.07,55.56,20.43,86.74,20.44,106.78.04,194.13-87.13,194.31-193.91.18-107.43-86.86-194.57-194.24-194.57Z" />

  <!-- D-Pad Inset Well -->
  <circle cx="225.96" cy="498.1" r="130" fill="url(#well-grad)" stroke="#232b3d" stroke-width="4" />

  <!-- Right Button Cluster Inset Well -->
  <circle cx="775.42" cy="503.17" r="180" fill="url(#well-grad)" stroke="#232b3d" stroke-width="4" />

  <!-- D-Pad Cross -->
  <g fill="url(#dpad-grad)">
    <rect x="195" y="380" width="62" height="236" rx="10" stroke="#334155" stroke-width="4" />
    <rect x="108" y="467" width="236" height="62" rx="10" stroke="#334155" stroke-width="4" />
    <circle cx="226" cy="498" r="16" fill="#1e293b" />
  </g>

  <!-- ABXY Diamond Buttons -->
  <!-- Top (Yellow / X) -->
  <circle cx="775" cy="385" r="42" fill="url(#btn-yellow)" stroke="#b45309" stroke-width="3" />
  <!-- Right (Red / A) -->
  <circle cx="875" cy="503" r="42" fill="url(#btn-red)" stroke="#991b1b" stroke-width="3" />
  <!-- Bottom (Green / B) -->
  <circle cx="775" cy="621" r="42" fill="url(#btn-green)" stroke="#065f46" stroke-width="3" />
  <!-- Left (Blue / Y) -->
  <circle cx="675" cy="503" r="42" fill="url(#btn-blue)" stroke="#1e40af" stroke-width="3" />

  <!-- Center Select / Start Pills -->
  <rect x="382" y="520" width="76" height="28" rx="14" fill="#475569" stroke="#1e293b" stroke-width="3" transform="rotate(-35 420 534)" />
  <rect x="502" y="520" width="76" height="28" rx="14" fill="#475569" stroke="#1e293b" stroke-width="3" transform="rotate(-35 540 534)" />
</svg>
